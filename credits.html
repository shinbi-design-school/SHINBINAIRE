<!DOCTYPE html>

<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SHINBINAIRE シンビネア | CREDITS 制作者紹介</title>
  <!-- ファビコン -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="stylesheet" href="css/common.css" />
  <link rel="stylesheet" href="css/credits.css" />
<!-- Modal CSS -->
    <link rel="stylesheet" href="https://unpkg.com/swiper@7/swiper-bundle.min.css" />
<!-- Modal js -->
    <script src="https://unpkg.com/swiper@7/swiper-bundle.min.js" defer></script>
    <script src="js/howto.js" defer></script>
<!-- Adobe Web Fonts -->
    <script>
      (function(d) {
        var config = {
          kitId: 'nyx6yfv',
          scriptTimeout: 3000,
          async: true
        },
        h=d.documentElement,t=setTimeout(function(){h.className=h.className.replace(/\bwf-loading\b/g,"")+" wf-inactive";},config.scriptTimeout),tk=d.createElement("script"),f=false,s=d.getElementsByTagName("script")[0],a;h.className+=" wf-loading";tk.src='https://use.typekit.net/'+config.kitId+'.js';tk.async=true;tk.onload=tk.onreadystatechange=function(){a=this.readyState;if(f||a&&a!="complete"&&a!="loaded")return;f=true;clearTimeout(t);try{Typekit.load(config)}catch(e){}};s.parentNode.insertBefore(tk,s)
      })(document);
    </script>
</head>

<body>

  <div class="bg"></div>

  <header>
        <div class="credits-header">
            <div class="header-line"></div>
            <div class="header-frame-container">
                <img src="images/ranking_title.png" alt="RANKING枠" class="header-frame-img">
                <span class="header-title-text font_en">CREDITS</span>
            </div>
        </div>     
    </header>

  <main class="page">

    

    <div class="title-block">
      <h1>KOCCHAN’S RIDERS CLUB</h1>
    </div>

    <div class="divider"></div>
 
    <div class="players">

      <div class="player">
        <div class="player-img-wrap">
          <a class="js-open-modal" data-slide-index="1">
            <img src="images/yanagida_body.png" alt="Yanagida" />
          </a>
        </div>

        <p class="player-name">ASUKA YANAGIDA</p>
        <p class="player-number"></p>
      </div>

      <div class="player">
        <div class="player-img-wrap">
          <a class="js-open-modal" data-slide-index="2">
            <img src="images/takahasi_body.png" alt="KOTONE TAKAHASHI" />
          </a>
        </div>
        <p class="player-name">KOTONE TAKAHASHI</p>
        <p class="player-number"></p>
      </div>

      <div class="player">
        <div class="player-img-wrap">
          <a class="js-open-modal" data-slide-index="3">
            <img src="images/kurita_body.png" alt="Kurita" />
          </a>
        </div>
        <p class="player-name">KENJI KURITA</p>
        <p class="player-number"></p>
      </div>

      <div class="player">
        <div class="player-img-wrap">
          <a class="js-open-modal" data-slide-index="4">
            <img src="images/ikeda_body.png" alt="Ikeda" />
          </a>
        </div>
        <p class="player-name">KEIKO IKEDA</p>
        
      </div>


    </div>

 
  </main>

  <!-- モーダル -->
    <div class="modal" id="modal">
      <div class="modal__overlay js-close-modal"></div>
      <div class="modal__content">
        <button class="modal__close-btn js-close-modal" aria-label="閉じる">×</button>
        <!-- スライダー -->
        <div class="swiper modal__slider">
          <div class="swiper-wrapper">
            <div class="swiper-slide modal__slide"><img class="credit_image" src="images/profile_yanagida.webp"></div>
            <div class="swiper-slide modal__slide"><img class="credit_image" src="images/profile_takahashi.webp"></div>
            <div class="swiper-slide modal__slide"><img class="credit_image" src="images/profile_kurita.webp"></div>
            <div class="swiper-slide modal__slide"><img class="credit_image" src="images/profile_ikeda.webp"></div>
          </div>
          <div class="swiper-button-prev"></div>
          <div class="swiper-button-next"></div>
        </div>
      </div>
    </div>
  <footer>
        <div id="copyright">
            <small>&copy; 2026 KOCCHAN'S RIDERS CLUB.</small>
        </div>
  </footer>
  <!-- /page -->

</body>
</html>
